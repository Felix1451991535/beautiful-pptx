<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 仅用于 LibreOffice 预览渲染：把 Windows 字体名映射到本机可用的近似字体 -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>微软雅黑</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei UI</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>思源黑体</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Source Han Sans SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><prefer><family>Selawik</family></prefer></alias>
  <!-- Georgia（Windows 自带衬线）→ Gelasio（与 Georgia 等宽度度量兼容的开源字体），仅用于预览 -->
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family><family>Gelasio</family></prefer></alias>
  <!-- 手写感（Windows 自带 Ink Free / Segoe Print）→ Kalam，仅用于预览 -->
  <alias binding="same"><family>Ink Free</family><prefer><family>Kalam</family></prefer></alias>
  <alias binding="same"><family>Segoe Print</family><prefer><family>Kalam</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Courier Prime</family></prefer></alias>
</fontconfig>
