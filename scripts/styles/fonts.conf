<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 风格库预览专用（独立文件，不依赖 lib/fonts.conf）：Windows/Office 字体名 → 本机近似开源字体。
     只影响 LibreOffice 预览渲染，pptx 里写入的仍是 Windows 字体名。 -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test qual="any" name="family"><string>微软雅黑</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Microsoft YaHei</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Microsoft YaHei UI</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Segoe UI</string></test><edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Segoe UI Black</string></test><edit name="family" mode="assign" binding="strong"><string>Archivo Black</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Georgia</string></test><edit name="family" mode="assign" binding="strong"><string>Gelasio</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Cambria</string></test><edit name="family" mode="assign" binding="strong"><string>Caladea</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Ink Free</string></test><edit name="family" mode="assign" binding="strong"><string>Kalam</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Segoe Print</string></test><edit name="family" mode="assign" binding="strong"><string>Patrick Hand</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Segoe Script</string></test><edit name="family" mode="assign" binding="strong"><string>Caveat</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Impact</string></test><edit name="family" mode="assign" binding="strong"><string>Anton</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Arial Black</string></test><edit name="family" mode="assign" binding="strong"><string>Archivo Black</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Courier New</string></test><edit name="family" mode="assign" binding="strong"><string>Courier Prime</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Bahnschrift</string></test><edit name="family" mode="assign" binding="strong"><string>Barlow</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Franklin Gothic Medium</string></test><edit name="family" mode="assign" binding="strong"><string>Libre Franklin</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>宋体</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>SimSun</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>华文中宋</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>STZhongsong</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>黑体</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>SimHei</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>等线</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>DengXian</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>华文行楷</string></test><edit name="family" mode="assign" binding="strong"><string>Ma Shan Zheng</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>STXingkai</string></test><edit name="family" mode="assign" binding="strong"><string>Ma Shan Zheng</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>楷体</string></test><edit name="family" mode="assign" binding="strong"><string>Ma Shan Zheng</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>KaiTi</string></test><edit name="family" mode="assign" binding="strong"><string>Ma Shan Zheng</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>方正姚体</string></test><edit name="family" mode="assign" binding="strong"><string>ZCOOL XiaoWei</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>FZYaoTi</string></test><edit name="family" mode="assign" binding="strong"><string>ZCOOL XiaoWei</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Yu Mincho</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK JP</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>游明朝</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK JP</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Segoe UI Light</string></test><edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit><edit name="style" mode="assign" binding="strong"><string>Light</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Segoe UI Semibold</string></test><edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit><edit name="style" mode="assign" binding="strong"><string>Semibold</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Segoe UI Semilight</string></test><edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit><edit name="style" mode="assign" binding="strong"><string>Semilight</string></edit></match>
</fontconfig>
